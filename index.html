<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10">
<title>The Final Moment</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--line:#29313e;--muted:#8995a5;--text:#edf2f8;--accent:#f05b4f}
*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:32px 20px 80px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#20293555,transparent 55%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(100%,1040px);text-align:center}.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:20px;color:#b1bbc8;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #f05b4f66;animation:pulse 1.8s ease-in-out infinite}
h1{margin:0;font-size:clamp(30px,5vw,54px);font-weight:500;letter-spacing:-.045em}.subtitle{margin:12px 0 50px;color:var(--muted);font-size:14px}
.clock{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,1.6vw,18px)}.unit{min-width:0;padding:clamp(17px,3vw,30px) 8px 22px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(155deg,#141b25f0,#0d121af0);box-shadow:0 18px 55px #0002}.value{display:block;font-variant-numeric:tabular-nums;font-size:clamp(28px,6.3vw,72px);font-weight:300;line-height:1;letter-spacing:-.055em}.label{display:block;margin-top:14px;color:var(--muted);font-size:clamp(9px,1.1vw,11px);font-weight:700;letter-spacing:.17em;text-transform:uppercase}.target{margin-top:34px;color:#778393;font-size:12px}
.edit{position:fixed;right:24px;bottom:24px;min-height:44px;padding:0 16px;border:1px solid #343e4c;border-radius:999px;background:#151c26;color:var(--text);font:inherit;font-size:13px;cursor:pointer;box-shadow:0 8px 28px #0005;transition:.18s}.edit:hover{background:#202a37;border-color:#657184;transform:translateY(-1px)}
dialog{width:min(440px,calc(100% - 32px));padding:0;border:1px solid #303a48;border-radius:16px;background:var(--panel);color:var(--text);box-shadow:0 24px 90px #000a}dialog::backdrop{background:#020408c2;backdrop-filter:blur(5px)}form{padding:28px;text-align:left}.head{display:flex;justify-content:space-between;gap:14px}h2{margin:0;font-size:20px;font-weight:550}.hint{margin:7px 0 23px;color:var(--muted);font-size:13px;line-height:1.5}.close{flex:none;width:32px;height:32px;margin:-5px -7px 0 0;border:0;border-radius:8px;background:transparent;color:#9ba6b5;font-size:22px;cursor:pointer}
label{display:block;margin:15px 0 7px;color:#b6c0cd;font-size:12px;font-weight:650}input{width:100%;min-height:44px;padding:0 12px;border:1px solid #333e4c;border-radius:8px;outline:none;background:#0b1017;color:var(--text);font:inherit;font-size:14px}input:focus{border-color:#76859a;box-shadow:0 0 0 3px #76859a26}.error{min-height:18px;margin:9px 0 2px;color:#ff8176;font-size:12px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.actions button{min-height:40px;padding:0 15px;border:1px solid #343e4c;border-radius:8px;background:#1a222d;color:var(--text);font:inherit;font-size:13px;cursor:pointer}.actions button[type=submit]{border-color:var(--accent);background:var(--accent);color:#160c0b;font-weight:700}
@keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px #f05b4f66}}@media(max-width:650px){body{padding:32px 16px 88px}.subtitle{margin-bottom:34px}.clock{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.unit{padding:20px 7px 17px}.value{font-size:clamp(38px,11vw,60px)}.label{margin-top:10px}.edit{right:16px;bottom:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main><div class="eyebrow"><span class="dot" aria-hidden="true"></span> The countdown is running</div><h1>Time until the final moment</h1><p class="subtitle">Every second brings it closer.</p>
<section class="clock" aria-label="Time remaining"><div class="unit"><span class="value" id="years">000</span><span class="label">Years</span></div><div class="unit"><span class="value" id="months">00</span><span class="label">Months</span></div><div class="unit"><span class="value" id="days">00</span><span class="label">Days</span></div><div class="unit"><span class="value" id="hours">00</span><span class="label">Hours</span></div><div class="unit"><span class="value" id="minutes">00</span><span class="label">Minutes</span></div><div class="unit"><span class="value" id="seconds">00</span><span class="label">Seconds</span></div></section><p class="target" id="target-note"></p></main>
<button class="edit" id="edit-button" type="button">✎ &nbsp;Change date</button>
<dialog id="edit-dialog" aria-labelledby="dialog-title"><form id="edit-form"><div class="head"><div><h2 id="dialog-title">Change the final moment</h2><p class="hint">Enter your password and choose a new date and time.</p></div><button class="close" id="close-button" type="button" aria-label="Close">×</button></div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><label for="target-input">New date and time</label><input id="target-input" type="datetime-local" required><p class="error" id="form-error" role="status" aria-live="polite"></p><div class="actions"><button id="cancel-button" type="button">Cancel</button><button type="submit">Save date</button></div></form></dialog>
<script>
(()=>{
 const DEFAULT_TARGET="2030-01-01T00:00:00.000Z";
 // Client-side verifier only deters casual edits; it is not server security.
 const PASSWORD_SHA256="x0erSY3Y801WdlXW/rprPZbIOKVQNWBLFxyzRYGatTE=";
 const ids=["years","months","days","hours","minutes","seconds"],fmt=new Intl.NumberFormat(undefined,{useGrouping:false}),dialog=document.getElementById("edit-dialog"),form=document.getElementById("edit-form"),input=document.getElementById("target-input"),zone=Intl.DateTimeFormat().resolvedOptions().timeZone;
 let target=readTarget();
 function readTarget(){const raw=new URLSearchParams(location.search).get("target"),d=raw?new Date(raw):new Date(DEFAULT_TARGET);return Number.isNaN(d.getTime())?new Date(DEFAULT_TARGET):d}
 function dim(y,m){return new Date(Date.UTC(y,m+1,0)).getUTCDate()}
 function addMonths(d,n){const ix=d.getUTCMonth()+n,y=d.getUTCFullYear()+Math.floor(ix/12),m=((ix%12)+12)%12,day=Math.min(d.getUTCDate(),dim(y,m));return new Date(Date.UTC(y,m,day,d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds(),d.getUTCMilliseconds()))}
 function remaining(now,end){if(end<=now)return[0,0,0,0,0,0];let cur=new Date(now),y=Math.max(0,end.getUTCFullYear()-cur.getUTCFullYear());while(y&&addMonths(cur,y*12)>end)y--;cur=addMonths(cur,y*12);let mo=Math.max(0,(end.getUTCFullYear()-cur.getUTCFullYear())*12+end.getUTCMonth()-cur.getUTCMonth());while(mo&&addMonths(cur,mo)>end)mo--;cur=addMonths(cur,mo);let ms=end-cur,day=Math.floor(ms/86400000);ms-=day*86400000;const h=Math.floor(ms/3600000);ms-=h*3600000;const min=Math.floor(ms/60000);ms-=min*60000;return[y,mo,day,h,min,Math.floor(ms/1000)]}
 function render(){remaining(new Date(),target).forEach((v,i)=>document.getElementById(ids[i]).textContent=fmt.format(v).padStart(i?2:3,"0"));document.getElementById("target-note").textContent="Target date · "+new Intl.DateTimeFormat(undefined,{dateStyle:"long",timeStyle:"short",timeZone:zone}).format(target)+" ("+zone+")"}
 function localValue(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
 async function passwordMatches(p){const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));return btoa(String.fromCharCode(...new Uint8Array(hash)))===PASSWORD_SHA256}
 document.getElementById("edit-button").onclick=()=>{input.value=localValue(target);document.getElementById("form-error").textContent="";document.getElementById("password").value="";dialog.showModal()};
 document.getElementById("close-button").onclick=()=>dialog.close();document.getElementById("cancel-button").onclick=()=>dialog.close();
 form.onsubmit=async e=>{e.preventDefault();const error=document.getElementById("form-error"),submit=form.querySelector('[type="submit"]');error.textContent="";submit.disabled=true;try{if(!await passwordMatches(document.getElementById("password").value)){error.textContent="That password doesn’t match. Try again.";return}const chosen=new Date(input.value);if(!Number.isFinite(chosen.getTime())){error.textContent="Choose a valid date and time.";return}target=chosen;const url=new URL(location.href);url.searchParams.set("target",target.toISOString());history.replaceState(null,"",url);render();dialog.close()}catch{error.textContent="Could not save that date. Please check the value."}finally{submit.disabled=false}};
 render();setInterval(render,1000);
})();
</script>
</body></html>
